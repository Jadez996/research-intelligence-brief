brief:
  title: "Nanoconfined Water Bulletin"
  lookback_days: 15
  minimum_score: 2
  maximum_papers: 100

# Topic-first discovery. This is optional: if it is disabled or absent, the
# weekly run behaves like the original seed-author-only brief.
paper_discovery:
  enabled: true

  # Topic searches use a wider window than the tracked-author brief so that
  # genuinely new papers are not missed by a short lookback.
  lookback_days: 45

  # Each query costs one OpenAlex search request (10 credits). Adding queries
  # is config-only; four queries plus a bounded radar keeps a normal run near
  # 52 requests.
  queries:
    - "confined water"
    - "interfacial water"
    - "atomic force microscopy hydration"
    - "titania water interface"

  results_per_query: 100
  query_bonus: 1
  max_query_bonus: 2
  recent_days: 30
  recent_bonus: 2

  include_types:
    - "article"
    - "preprint"
    - "review"

  exclude_retracted: true

  # Topic-only papers must have a configured keyword match. Papers that also
  # include a tracked author keep the existing tracked-author evidence rule.
  require_keyword_match: true

  candidate_authors_limit: 50

reporting:
  issue_top_papers: 8
  issue_tracked_papers: 5
  issue_candidate_authors: 5
  issue_max_chars: 55000


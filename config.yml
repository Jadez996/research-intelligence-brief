researcher_discovery:
  enabled: true

  # Reuse Phase 1 paper metadata for candidate discovery, then enrich only a
  # bounded shortlist with each author's recent publication history.
  analysis_years: 5
  minimum_work_relevance: 2

  # OpenAlex occasionally has duplicate author IDs for a tracked person.
  # Exclude candidate records whose normalised name matches a configured seed.
  exclude_seed_names: true

  # 25 enrichments add 25 author-works requests. Combined with the 27 Phase 1
  # seed/topic requests this stays near 52 requests, below the ~80 budget.
  candidate_pool_size: 25
  maximum_researchers: 20

  # Two relevant papers are normally required for RECOMMENDED; one-paper
  # authors remain useful WATCH candidates.
  recommendation_min_papers: 2

  # Concise Issue limits. The full set remains in researcher_radar.json.
  issue_recommended: 3
  issue_watch: 2
  issue_outside: 3
  issue_reappearing: 3
  issue_emerging: 3

  # EMERGING_ACTIVITY is a recent-publication-rate signal only. It is not
  # age, career stage, seniority, quality, or citation impact.
  emerging_min_recent: 2
  emerging_rate_multiplier: 1.5

  enrich_include_types:
    - "article"
    - "preprint"
    - "review"

  # Recent activity window.
  recent_years: 2

  # Flag group pairs with overlapping OpenAlex topics but no observed
  # relevant coauthored work between configured seed groups.
  group_similarity_threshold: 0.15

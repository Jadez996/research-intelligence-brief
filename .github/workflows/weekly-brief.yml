name: Weekly Research Intelligence Brief

on:
  schedule:
    - cron: "21  0 * * 0"
  workflow_dispatch:
    
permissions:
  contents: write
  issues: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate weekly brief
        env:
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          python generate_brief.py

      - name: Check generated reports
        run: |
          test -f weekly_brief.md
          test -f issue_brief.md
          test -f researcher_radar.md
          test -f researcher_radar.json
          test -f researcher_history.json
          echo "Generated files:"
          ls -lh weekly_brief.md issue_brief.md researcher_radar.md researcher_radar.json researcher_history.json
          sed -n '1,80p' weekly_brief.md

      - name: Create GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_TITLE="Research Bulletin $(date -u +%Y-%m-%d)"
          gh issue create \
            --title "$ISSUE_TITLE" \
            --body-file weekly_brief.md \
            --label "research-brief"

      - name: Save generated state and researcher radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_works.json researcher_radar.md researcher_radar.json researcher_history.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update processed works and researcher radar"
            git push
          fi

      - name: Upload reports as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-research-intelligence
          if-no-files-found: error
          path: |
            weekly_brief.md
            issue_brief.md
            researcher_radar.md
            researcher_radar.json
            researcher_history.json
            seen_works.json
          retention-days: 30
